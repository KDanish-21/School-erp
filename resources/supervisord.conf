; Fully self-contained single-container process manager: MariaDB + Redis +
; nginx + gunicorn + socketio + worker + scheduler, all in one Railway service.
; supervisord itself runs as root (default, no `user=` at [supervisord] level)
; so program 0 (fix-permissions) can chown freshly-mounted Railway Volumes;
; every actual long-running program then drops to the non-root `frappe` user
; via its own `user=frappe` directive.

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; --- 0: fix ownership of freshly-mounted volumes, link baked assets (root, one-shot) ---
[program:fix-permissions]
command=/usr/local/bin/fix-permissions.sh
priority=0
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- 1: database + cache, start first ---
[program:mariadb]
command=/usr/local/bin/start-mariadb.sh
user=frappe
priority=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --daemonize no --save "" --appendonly no
user=frappe
priority=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- 5: one-shot site bootstrap (waits for mariadb/redis, creates/migrates the site) ---
; autorestart=unexpected + exitcodes=0: a clean exit (0) is done, never
; restarted. A nonzero exit retries automatically — every step in
; bootstrap.sh (site creation, healthcare self-heal install, guide pages,
; both seed scripts) is guarded to be safely re-run from scratch, so this
; lets a transient failure (e.g. mariadbd getting OOM-killed mid-migration
; under a tight memory limit, observed the hard way testing this exact image
; under a constrained container) self-heal on the next attempt instead of
; leaving the site stuck on a partial bootstrap until someone notices and
; manually triggers a redeploy. startsecs=5 (not 0) so startretries=5 still
; caps a genuinely-instant failure (e.g. a missing required env var) — a
; crash that happens after minutes of real migration work, like the OOM
; case, has already cleared startsecs and is retried indefinitely instead,
; since each such retry provably makes forward progress.
[program:bootstrap]
command=/usr/local/bin/bootstrap.sh
directory=/home/frappe/frappe-bench
user=frappe
priority=5
autostart=true
autorestart=unexpected
exitcodes=0
startretries=5
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- 20: web-facing processes (self-heal via autorestart until bootstrap finishes) ---
[program:nginx]
command=/usr/local/bin/nginx-entrypoint.sh
user=frappe
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gunicorn]
directory=/home/frappe/frappe-bench/sites
command=/home/frappe/frappe-bench/env/bin/gunicorn --bind=0.0.0.0:8000 --threads=%(ENV_GUNICORN_THREADS)s --workers=%(ENV_GUNICORN_WORKERS)s --worker-class=gthread --worker-tmp-dir=/dev/shm --timeout=%(ENV_GUNICORN_TIMEOUT)s --preload frappe.app:application
user=frappe
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:socketio]
directory=/home/frappe/frappe-bench
command=node apps/frappe/socketio.js
user=frappe
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- 30: background processes ---
[program:worker]
directory=/home/frappe/frappe-bench
command=/usr/local/bin/bench worker --queue short,default,long
user=frappe
priority=30
autorestart=true
stopwaitsecs=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
directory=/home/frappe/frappe-bench
command=/usr/local/bin/bench schedule
user=frappe
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
