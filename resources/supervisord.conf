; Consolidated single-container process manager for the Railway deployment.
; Normally frappe_docker splits these into separate containers (backend,
; frontend/nginx, websocket, queue-short, queue-long, scheduler) — here they
; all run together under supervisord to keep this to one Railway service.

[unix_http_server]
file=/home/frappe/frappe-bench/config/pids/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/frappe/frappe-bench/config/pids/supervisor.sock

[supervisord]
; No `user=` directive here — the container already runs as the non-root
; `frappe` user (set in the Containerfile), and having supervisord try to
; setuid to its own current user is unnecessary and can fail without CAP_SETUID.
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/home/frappe/frappe-bench/config/pids/supervisord.pid

[program:nginx]
command=/usr/local/bin/nginx-entrypoint.sh
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gunicorn]
directory=/home/frappe/frappe-bench/sites
command=/home/frappe/frappe-bench/env/bin/gunicorn --bind=0.0.0.0:8000 --threads=%(ENV_GUNICORN_THREADS)s --workers=%(ENV_GUNICORN_WORKERS)s --worker-class=gthread --worker-tmp-dir=/dev/shm --timeout=%(ENV_GUNICORN_TIMEOUT)s --preload frappe.app:application
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:socketio]
directory=/home/frappe/frappe-bench
command=node apps/frappe/socketio.js
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
directory=/home/frappe/frappe-bench
command=/usr/local/bin/bench worker --queue short,default,long
priority=30
autorestart=true
stopwaitsecs=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
directory=/home/frappe/frappe-bench
command=/usr/local/bin/bench schedule
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
